name: Deploy drawing interface to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - public/**
      - src/**
      - data/examples/**
      - schemas/**
      - scripts/build_pages.ps1
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static application assets
        shell: pwsh
        run: ./scripts/build_pages.ps1
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
